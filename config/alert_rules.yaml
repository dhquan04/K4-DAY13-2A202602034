alerts:
  - name: HighLatencyP95
    severity: critical
    condition: latency_p95_ms > 3000ms for 5m
    type: symptom-based
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1-highlatencyp95
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2% for 5m
    type: symptom-based
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2-higherrorrate
  - name: DegradedResponseQuality
    severity: warning
    condition: quality_score_avg < 0.75 for 10m
    type: symptom-based
    owner: ai-platform-team
    runbook: docs/alerts.md#alert-3-degradedresponsequality

