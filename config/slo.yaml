service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: Tail latency budget matching dashboard panel latency (p95 <= 3000ms)
  error_rate_pct:
    objective: 2
    target: 99.0
    note: User-facing error rate budget matching dashboard panel errors (error_rate <= 2%)
  window_cost_usd:
    objective: 2.5
    target: 100.0
    measurement_window: 60m
    note: 60-minute dashboard window limit matching dashboard panel cost (cost <= 2.50 USD)
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: Response quality proxy score matching dashboard panel quality (quality >= 0.75)

